# Tests the extension on every push to main, and releases it when the version in
# extension/package.json has no `v<version>` tag yet: one .vsix is published to
# both the VS Code Marketplace and Open VSX, then tagged as a GitHub release.
#
# To release, bump `version` in extension/package.json (and add its section to
# extension/CHANGELOG.md) in the pull request, and merge it.
#
# The VS Code Marketplace is published to with Microsoft Entra ID, not a
# personal access token (Azure DevOps retires those on 2026-12-01): the job
# signs in as an Entra app registration that trusts this repository's main
# branch, and that app is a member of the `mepolabs` publisher. Setup steps
# are in CONTRIBUTING.md. Needs three repository secrets:
#   AZURE_CLIENT_ID  the app registration's Application (client) ID
#   AZURE_TENANT_ID  its Directory (tenant) ID
#   OVSX_PAT         Open VSX access token for the `mepolabs` namespace
name: Release extension

on:
  push:
    branches: [main]
    paths:
      - extension/**
      - schema/**
      - examples/**
      - LICENSE
      - .github/workflows/release.yml
  workflow_dispatch:

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: extension

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Is this version released yet?
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; testing only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; it will be released."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/agent-walkthrough-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  # The two stores are independent: if one fails, re-run just that job.
  # --skip-duplicate makes a re-run succeed where the version is already up.
  marketplace:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign in to Entra ID as this repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: extension
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The ID to add to the publisher as a member (see CONTRIBUTING.md). Not a secret.
      - name: Show the app's Marketplace profile ID
        run: |
          az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath "agent-walkthrough-${{ needs.build.outputs.version }}.vsix" --skip-duplicate

  open-vsx:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: extension
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish --packagePath "agent-walkthrough-${{ needs.build.outputs.version }}.vsix" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Tagging last means a failed publish leaves the version untagged, so the
  # next push to main (or a manual run) tries again.
  github-release:
    needs: [build, marketplace, open-vsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: extension
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # This version's CHANGELOG section: from its heading to the next one.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Agent Walkthrough $VERSION" > notes.md
          gh release create "v$VERSION" "agent-walkthrough-$VERSION.vsix" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
